name: Anime Episode Notifier & Downloader

on:
  push:
    branches: [ "main" ]
  schedule:
    # Runs every 15 minutes automatically for RSS monitoring
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [ download_clean ]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to download and remove watermark'
        required: false
        default: ''

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run Notifier & Watermark Remover
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
          INPUT_MSG_ID: ${{ github.event.client_payload.message_id }}
        run: |
          python anime_notifier.py

      - name: Commit & Push History Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_history.json bot_offset.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update history [skip ci]" && git push)
